[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../packages/config" }]
gas_reports = ["AegisVault", "PolicyGuard", "ViolationCourt", "BondManager"]
ffi = false

# via_ir produces *larger* bytecode for AegisVault than the legacy pipeline, so it is off by
# default. Kept as an opt-in profile in case a future change hits stack-too-depth.
[profile.ir]
via_ir = true

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[lint]
# Timestamps are stored as uint64 throughout (a convention, not an accident) and basis-point
# arithmetic is range-checked before every narrowing cast, so the typecast lint is noise here.
# The rest are style-only.
exclude_lints = [
  "named-struct-fields",
  "mixed-case-function",
  "unsafe-typecast",
  "unused-import",
  "screaming-snake-case-immutable",
  "screaming-snake-case-const",
]

[rpc_endpoints]
robinhood = "${RH_TESTNET_RPC}"
arbitrum_sepolia = "${ARB_SEPOLIA_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
