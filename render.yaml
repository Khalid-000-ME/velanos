# Render blueprint for the Velanos back end. The web app itself goes to Vercel.
#
# `corepack enable` is deliberately not used: it tries to symlink into /usr/bin, which is read-only on
# Render's builders. `corepack pnpm` runs the version pinned in package.json without touching /usr/bin.
#
# Secrets are declared with `sync: false`, so Render prompts for them instead of keeping them in git.
services:
  - type: web
    name: velanos-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm --filter @velanos/server start:prod
    healthCheckPath: /health
    disk:
      name: velanos-data
      mountPath: /opt/render/project/src/apps/server/data
      sizeGB: 1
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: USDG_MODE
        value: official
      - key: STOCK_TOKEN_MODE
        value: official
      - key: PERP_MODE
        value: none
      - key: LLM_MODE
        value: live
      - key: RH_TESTNET_RPC
        value: https://rpc.testnet.chain.robinhood.com
      - key: ARB_SEPOLIA_RPC
        value: https://sepolia-rollup.arbitrum.io/rpc
      - key: AGENT_URL
        fromService:
          type: pserv
          name: velanos-agent
          property: hostport
      - key: RELAY_PK
        sync: false
      - key: DEMO_ADMIN_TOKEN
        sync: false

  - type: pserv
    name: velanos-agent
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm --filter @velanos/agent start:prod
    envVars:
      - key: AGENT_PORT
        value: "10000"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_MODE
        value: live
      - key: RH_TESTNET_RPC
        value: https://rpc.testnet.chain.robinhood.com
      - key: ARB_SEPOLIA_RPC
        value: https://sepolia-rollup.arbitrum.io/rpc
      - key: SERVER_URL
        fromService:
          type: web
          name: velanos-api
          property: host
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_SIGNER_PK
        sync: false
      - key: AGENT_TX_PK
        sync: false
      - key: DEMO_ADMIN_TOKEN
        sync: false

  - type: worker
    name: velanos-watcher
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm --filter @velanos/watcher start:prod
    envVars:
      - key: RH_TESTNET_RPC
        value: https://rpc.testnet.chain.robinhood.com
      - key: ARB_SEPOLIA_RPC
        value: https://sepolia-rollup.arbitrum.io/rpc
      - key: SERVER_URL
        fromService:
          type: web
          name: velanos-api
          property: host
      - key: WATCHER_PK
        sync: false
      - key: PRICE_UPDATER_PK
        sync: false
