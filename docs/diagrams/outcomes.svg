rips</text><text x="916" y="436" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b5bfb1">BOND</text><text x="916" y="460" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#75fb65">Bond tops depositors up to the floor</text><text x="48" y="520" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b5bfb1">Consequence matches the fault: we punish misconduct, not volatility.</text></svg>