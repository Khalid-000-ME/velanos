<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 650" width="1360" height="650"><defs><marker id="a75fb65" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75fb65"/></marker><marker id="aff6a3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6a3d"/></marker><marker id="ab5bfb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b5bfb1"/></marker><marker id="af5b83d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b83d"/></marker></defs><rect width="1360" height="650" fill="#050805"/><text x="48" y="64" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f3f7f1">Prevent → Prove → Pay</text><text x="48" y="94" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b5bfb1">What happens to one trade, from signature to slash</text><rect x="48" y="170" width="200" height="92" rx="18" fill="#0c110b" stroke="#2a3328" stroke-width="1.5"/><text x="148.0" y="210.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f3f7f1">Agent signs</text><text x="148.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">an EIP-712 trade intent</text><line x1="248" y1="216" x2="320" y2="216" stroke="#b5bfb1" stroke-width="2.5" marker-end="url(#ab5bfb1)"/><rect x="320" y="150" width="250" height="132" rx="18" fill="#0c110b" stroke="#75fb65" stroke-width="1.5"/><text x="445.0" y="210.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f3f7f1">PolicyGuard</text><text x="445.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">14 on-chain checks</text><text x="445.0" y="250.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">against the immutable mandate</text><line x1="570" y1="190" x2="680" y2="120" stroke="#75fb65" stroke-width="2.5" marker-end="url(#a75fb65)"/><text x="560" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#75fb65">every check passes</text><rect x="680" y="70" width="260" height="100" rx="18" fill="#0c110b" stroke="#75fb65" stroke-width="1.5"/><text x="810.0" y="114.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f3f7f1">Executes</text><text x="810.0" y="136.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">via an allowlisted adapter</text><text x="810.0" y="154.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">exact amount, nothing else</text><line x1="570" y1="250" x2="680" y2="330" stroke="#ff6a3d" stroke-width="2.5" marker-end="url(#aff6a3d)"/><text x="585" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ff6a3d">a static rule fails</text><rect x="680" y="280" width="260" height="100" rx="18" fill="#0c110b" stroke="#ff6a3d" stroke-width="1.5"/><text x="810.0" y="324.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ff6a3d">Refused, never executed</text><text x="810.0" y="346.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">but the signature is published</text><line x1="940" y1="330" x2="1010" y2="330" stroke="#ff6a3d" stroke-width="2.5" marker-end="url(#aff6a3d)"/><rect x="1010" y="280" width="250" height="100" rx="18" fill="#0c110b" stroke="#ff6a3d" stroke-width="1.5"/><text x="1135.0" y="324.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f3f7f1">Anyone reports it</text><text x="1135.0" y="346.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">signature = proof of misconduct</text><line x1="1135" y1="380" x2="1135" y2="440" stroke="#ff6a3d" stroke-width="2.5" marker-end="url(#aff6a3d)"/><rect x="960" y="440" width="350" height="110" rx="18" fill="#0c110b" stroke="#75fb65" stroke-width="1.5"/><text x="1135.0" y="489.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#75fb65">ViolationCourt slashes the bond</text><text x="1135.0" y="511.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">90% to depositors · 10% reporter bounty</text><text x="1135.0" y="529.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b5bfb1">same transaction</text><text x="48" y="520" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#75fb65">A blocked trade still pays.</text><text x="48" y="552" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b5bfb1">Guardrails stop at “blocked”. Velanos keeps the signature as evidence.</text><text x="48" y="610" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b5bfb1">Two breaches freeze the vault and unwind it to USDG. Live-state rejections (price, balance, limits) are never slashable.</text></svg>